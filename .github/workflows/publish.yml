name: publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile's own smoke test runs the whole pipeline, so a broken
      # delegate or a syntax error fails the build for both architectures.
      - name: Sanity-check the scripts
        run: |
          python3 -m py_compile a4norm a4norm-serve
          sh -n entrypoint.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/a4norm
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to gmlabs
    needs: image
    runs-on: gmlabs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: read
    env:
      SERVICE: a4norm_app
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Pull the image this commit built
        run: docker pull ghcr.io/${{ github.repository_owner }}/a4norm:sha-${{ steps.sha.outputs.short }}

      # Update only. Creating the service needs the stack file, which carries
      # networks and resource limits that belong to the host, not to this
      # public repository — so the first deploy stays a deliberate manual step.
      - name: Roll the service onto it
        run: |
          if docker service ls --format '{{.Name}}' | grep -qx "${SERVICE}"; then
            docker service update \
              --image ghcr.io/${{ github.repository_owner }}/a4norm:sha-${{ steps.sha.outputs.short }} \
              --update-order start-first \
              --detach=false \
              "${SERVICE}"
          else
            echo "::warning::service ${SERVICE} not found — deploy it once from its stack file, then this job keeps it updated"
          fi

      - name: Confirm the service is healthy on the new image
        run: |
          for i in $(seq 1 20); do
            CID=$(docker ps -q -f name="${SERVICE}" | head -1)
            if [ -n "$CID" ] && docker exec "$CID" python3 -c "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health')); sys.exit(0 if d.get('status')=='ok' else 1)"; then
              echo "health ok on $(docker inspect --format '{{.Config.Image}}' "$CID")"
              exit 0
            fi
            sleep 3
          done
          echo "the service did not answer /health after the update"
          exit 1
