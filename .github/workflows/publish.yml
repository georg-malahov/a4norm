name: publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The public examples through the image that is about to be pushed, before
  # anything is pushed. `image` and `deploy` both wait for it, so a change that
  # breaks the landing-page demo (examples/notebook-photo.jpg) never reaches
  # GHCR or production. Both flavours: production runs :full, users pull
  # :latest, and the two ImageMagick builds differ enough to need their own
  # goldens (see tests/regression.py). amd64 only -- the output is the same
  # on arm64 (README, Determinism), and emulating it would cost minutes.
  test:
    name: Regression test (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # rs_psnr: how close the Rust stages must stay to this image's
          # ImageMagick. Debian's 7.1.1 rounds its grey a hair differently
          # from 7.1.2 (the Alpine image, and the browser's build): ~52 dB
          # there against 68-96 dB here, and neither is visible.
          - flavor: light
            dockerfile: Dockerfile
            rs_psnr: 60
          - flavor: full
            dockerfile: Dockerfile.full
            rs_psnr: 50
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the scripts
        run: |
          python3 -m py_compile a4norm a4norm-serve a4norm-seg tests/regression.py
          sh -n entrypoint.sh
          sh -n tests/run-in-docker.sh

      - uses: docker/setup-buildx-action@v3

      # Cached under its own scope, which the `image` job reads first: the
      # amd64 layers it pushes are then the very layers tested here.
      - name: Build the image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: a4norm:test
          cache-from: |
            type=gha,scope=test-${{ matrix.flavor }}
            type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,scope=test-${{ matrix.flavor }}

      - name: Run the examples through it
        run: tests/run-in-docker.sh a4norm:test --flavor ${{ matrix.flavor }} --artifacts regression-out

      # The Rust port (a4norm-rs/) against the script in this very image:
      # the page as it enters flat_field is kept, and every stage the crate
      # reproduces must stay within rs_psnr dB of what ImageMagick made of it.
      - name: The Rust finishing matches the script
        run: |
          mkdir -p rs-out
          for ex in notebook-photo.jpg landing-invoice.webp; do
            docker run --rm -v "$PWD:/repo" -w /repo --user "$(id -u):$(id -g)" \
              --entrypoint python3 a4norm:test a4norm-rs/bench/dump.py a4norm \
              "rs-out/${ex%.*}" -- --format jpg -o "rs-out/${ex%.*}.jpg" "examples/$ex"
          done
          cd a4norm-rs
          cargo test --release
          cargo build --release --features cli
          for ex in notebook-photo landing-invoice; do
            target/release/a4norm-finish "../rs-out/$ex-in.png" "../rs-out/$ex-rs.png" \
              --compare "../rs-out/$ex" --min-psnr ${{ matrix.rs_psnr }}
          done
          rustup target add wasm32-unknown-unknown
          RUSTFLAGS="-C target-feature=+simd128" \
            cargo build --release --lib --target wasm32-unknown-unknown

      - name: Keep the PDFs and renders of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.flavor }}
          path: regression-out/
          if-no-files-found: ignore

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The light image is the product: stdlib-only, 104 MB, no ML.
          - flavor: light
            dockerfile: Dockerfile
            suffix: ""
          # The full image is the same a4norm plus a segmentation model, for
          # the photographs where the sheet is darker than what it lies on.
          # Debian, not Alpine: onnxruntime has no musl wheels.
          - flavor: full
            dockerfile: Dockerfile.full
            suffix: "full-"
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile's own smoke test runs the whole pipeline, so a broken
      # delegate or a syntax error fails the build for both architectures.
      - name: Sanity-check the scripts
        run: |
          python3 -m py_compile a4norm a4norm-serve a4norm-seg
          sh -n entrypoint.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/a4norm
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=${{ matrix.suffix }}{{version}}
            type=semver,pattern=${{ matrix.suffix }}{{major}}.{{minor}}
            type=raw,value=${{ matrix.flavor == 'full' && 'full' || 'latest' }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ matrix.suffix }}sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.flavor == 'full' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=test-${{ matrix.flavor }}
            type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}

  deploy:
    name: Deploy to gmlabs
    # `test` is already upstream of `image`; named here too so the gate is
    # visible where it matters.
    needs: [test, image]
    runs-on: gmlabs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: read
    env:
      SERVICE: a4norm_app
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Pull the image this commit built
        run: docker pull ghcr.io/${{ github.repository_owner }}/a4norm:full-sha-${{ steps.sha.outputs.short }}

      # Update only. Creating the service needs the stack file, which carries
      # networks and resource limits that belong to the host, not to this
      # public repository — so the first deploy stays a deliberate manual step.
      - name: Roll the service onto it
        run: |
          if docker service ls --format '{{.Name}}' | grep -qx "${SERVICE}"; then
            docker service update \
              --image ghcr.io/${{ github.repository_owner }}/a4norm:full-sha-${{ steps.sha.outputs.short }} \
              --update-order start-first \
              --detach=false \
              "${SERVICE}"
          else
            echo "::warning::service ${SERVICE} not found — deploy it once from its stack file, then this job keeps it updated"
          fi

      - name: Confirm the service is healthy on the new image
        run: |
          for i in $(seq 1 20); do
            CID=$(docker ps -q -f name="${SERVICE}" | head -1)
            if [ -n "$CID" ] && docker exec "$CID" python3 -c "import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health')); sys.exit(0 if d.get('status')=='ok' else 1)"; then
              echo "health ok on $(docker inspect --format '{{.Config.Image}}' "$CID")"
              exit 0
            fi
            sleep 3
          done
          echo "the service did not answer /health after the update"
          exit 1
