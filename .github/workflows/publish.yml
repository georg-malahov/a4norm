name: publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The public examples through the image that is about to be pushed, before
  # anything is pushed. `image` waits for it, so a change that breaks the
  # landing-page demo (examples/notebook-photo.jpg) never reaches GHCR.
  # Both flavours: production runs :full, users pull
  # :latest, and the two ImageMagick builds differ enough to need their own
  # goldens (see tests/regression.py). amd64 only -- the output is the same
  # on arm64 (README, Determinism), and emulating it would cost minutes.
  test:
    name: Regression test (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: light
            dockerfile: Dockerfile
          - flavor: full
            dockerfile: Dockerfile.full
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the scripts
        run: |
          python3 -m py_compile a4norm a4norm-serve a4norm-seg tests/regression.py
          sh -n entrypoint.sh
          sh -n tests/run-in-docker.sh

      - uses: docker/setup-buildx-action@v3

      # Cached under its own scope, which the `image` job reads first: the
      # amd64 layers it pushes are then the very layers tested here.
      - name: Build the image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: a4norm:test
          cache-from: |
            type=gha,scope=test-${{ matrix.flavor }}
            type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,scope=test-${{ matrix.flavor }}

      - name: Run the examples through it
        run: tests/run-in-docker.sh a4norm:test --flavor ${{ matrix.flavor }} --artifacts regression-out

      # a4norm in the image is the Rust port (a4norm-rs/); the examples above
      # ran through it. Its own unit tests pin the ImageMagick geometry it
      # reproduces (kernels, Gaussian widths, sample offsets).
      - name: Rust unit tests
        if: matrix.flavor == 'light'
        run: cd a4norm-rs && cargo test --release --locked

      - name: Keep the PDFs and renders of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.flavor }}
          path: regression-out/
          if-no-files-found: ignore

  # The OCR module of A4Norm Forms (a4norm-ocr/): not in the images, and not a
  # gate for them. Its tests read the demo form back against the text of the
  # PDF it came from and find its fields, and those of official forms; the
  # models are fetched by their pinned sha256.
  ocr:
    name: OCR tests (a4norm-ocr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: a4norm-ocr/models
          key: ocr-models-${{ hashFiles('a4norm-ocr/models.sh') }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            a4norm-ocr/target
            a4norm-rs/target
          key: ocr-cargo-${{ hashFiles('a4norm-ocr/Cargo.lock', 'a4norm-rs/Cargo.lock') }}

      - name: Fetch the models
        run: a4norm-ocr/models.sh

      # the geometry tests render the demo PDF and the official forms
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      # the geometry tests read the demo scans as the scanner leaves them
      - name: Build the scanner
        run: cd a4norm-rs && cargo build --release --locked --bin a4norm

      - name: Rust tests
        run: cd a4norm-ocr && cargo test --release --locked

      # the fill module's crate on its own (its font test; the rest runs above)
      - name: Fill crate tests
        run: cd a4norm-fill && cargo test --release --locked

  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The light image is the product: stdlib-only, 104 MB, no ML.
          - flavor: light
            dockerfile: Dockerfile
            suffix: ""
          # The full image is the same a4norm plus a segmentation model, for
          # the photographs where the sheet is darker than what it lies on.
          # Debian, not Alpine: onnxruntime has no musl wheels.
          - flavor: full
            dockerfile: Dockerfile.full
            suffix: "full-"
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile's own smoke test runs the whole pipeline, so a broken
      # delegate or a syntax error fails the build for both architectures.
      - name: Sanity-check the scripts
        run: |
          python3 -m py_compile a4norm a4norm-serve a4norm-seg
          sh -n entrypoint.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/a4norm
          flavor: |
            latest=false
          tags: |
            type=semver,pattern=${{ matrix.suffix }}{{version}}
            type=semver,pattern=${{ matrix.suffix }}{{major}}.{{minor}}
            type=raw,value=${{ matrix.flavor == 'full' && 'full' || 'latest' }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ matrix.suffix }}sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.flavor == 'full' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=test-${{ matrix.flavor }}
            type=gha,scope=${{ matrix.flavor }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}
